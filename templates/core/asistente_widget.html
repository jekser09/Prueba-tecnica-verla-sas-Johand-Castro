{% load static %}
<!-- Widget Flotante del Asistente Copiloto IA (Google Gemini) -->
<div id="verla-ai-container">
  <!-- Botón Burbuja Flotante -->
  <button id="verla-ai-btn" type="button" aria-label="Abrir Copiloto IA VERLA" title="Abrir Copiloto IA">
    <img src="{% static 'img/gemini-logo-white.svg' %}" alt="Gemini AI" width="22" height="22">
    <span>Asistente</span>
  </button>

  <!-- Drawer Lateral / Ventana de Chat Desplegable -->
  <aside id="verla-ai-drawer" class="verla-ai-drawer" aria-hidden="true" data-consultar-url="{% url 'asistente_api_consultar' %}" data-veredicto-url="{% url 'asistente_api_veredicto' %}">
    <header class="verla-ai-header">
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <img src="{% static 'img/gemini-logo-white.svg' %}" alt="Gemini" width="20" height="20">
        <div>
          <strong style="font-size: 0.95rem; color: #FFFFFF;">Copiloto VERLA</strong><br>
          <small style="color: #A09EC7; font-size: 0.75rem;">gemini-2.5-flash &bull; Activo</small>
        </div>
      </div>
      <div style="display: flex; gap: 0.4rem; align-items: center;">
        <button id="verla-ai-clear-btn" type="button" class="outline secondary" title="Limpiar conversación actual" style="padding: 0.2rem 0.5rem; font-size: 0.75rem; margin: 0;">
          🗑️
        </button>
        <button id="verla-ai-close-btn" type="button" class="outline contrast" aria-label="Cerrar" style="padding: 0.2rem 0.5rem; font-size: 0.75rem; margin: 0;">
          ✕
        </button>
      </div>
    </header>

    <!-- Atajos Rápidos Contextuales -->
    <div class="verla-ai-chips">
      <button type="button" class="ai-chip" data-prompt="Redacta un copy comercial persuasivo para una oferta de Fibra Óptica 500MB en Bogotá con 20% de descuento los primeros 3 meses.">
        🎁 Redactar Oferta Fibra
      </button>
      <button type="button" class="ai-chip" data-prompt="Analiza las metas del mes actual, identifica vendedores rezagados y sugiéreme un plan de acción comercial.">
        📈 Analizar Brecha de Metas
      </button>
    </div>

    <!-- Contenedor de Mensajes del Chat -->
    <div id="verla-ai-messages" class="verla-ai-messages">
      <!-- Los mensajes se renderizan dinámicamente desde sessionStorage -->
    </div>

    <!-- Footer con Entrada de Texto -->
    <footer class="verla-ai-footer">
      <form id="verla-ai-form" style="display: flex; gap: 0.5rem; margin: 0; width: 100%;">
        {% csrf_token %}
        <input type="text" id="verla-ai-input" placeholder="Pregunta algo sobre metas, red u ofertas..." required style="margin: 0; font-size: 0.85rem; flex: 1;">
        <button type="submit" id="verla-ai-send-btn" class="contrast" style="margin: 0; padding: 0.35rem 0.8rem; font-size: 0.85rem;">
          Enviar
        </button>
      </form>
    </footer>
  </aside>
</div>
